[project]
name = "scifact-retriever"
version = "0.1.0"
description = "Dense, BM25, and hybrid evidence retrieval for BEIR SciFact"
requires-python = ">=3.12,<3.14"
readme = "README.md"
dependencies = [
    "datasets>=4.4,<5",
    "fastembed>=0.7,<0.8",
    "langchain-core>=1.2,<2",
    "langchain-huggingface>=1.2,<2",
    "langchain-qdrant>=1.1,<2",
    "pydantic-settings>=2.12,<3",
    "qdrant-client>=1.16,<1.17",
    "sentence-transformers>=5.2,<6",
    "torch>=2.8,<2.11",
    "transformers>=4.51,<5",
]

[project.scripts]
scifact-ingest = "scifact_retriever.cli:ingest_main"
scifact-evaluate = "scifact_retriever.cli:evaluate_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=9,<10", "ruff>=0.15,<1"]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: uses a running Qdrant server"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
