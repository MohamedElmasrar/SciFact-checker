[project]
name = "fact-checker-agent"
version = "0.1.0"
description = "Scientific research and claim verification with Gemini and LangGraph"
requires-python = ">=3.12,<3.14"
dependencies = [
    "langchain>=1.2,<2",
    "langchain-google-genai>=4,<5",
    "langchain-mcp-adapters>=0.2,<1",
    "langgraph>=1.0,<2",
    "pydantic-settings>=2.12,<3",
    "scifact-retriever",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fact_checker"]

[dependency-groups]
dev = ["langgraph-cli[inmem]>=0.4,<1", "pytest>=9,<10", "pytest-asyncio>=1,<2", "ruff>=0.15,<1"]

[tool.uv.sources]
scifact-retriever = { path = "../scifact-retriever", editable = true }
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
